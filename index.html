<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RadioMix — Broadcast Web</title>
  <meta name="theme-color" content="#0C0E12" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ORION292/RadioMixWeb@main/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <div><h1>RadioMix</h1><span class="version">WEB · v2.1 DSP</span></div>
      </div>
      <div class="header-status"><span id="onair-badge" class="badge offline">OFFLINE</span><span id="clock" class="clock">--:--:--</span></div>
    </header>
    <nav class="tabs">
      <button class="tab active" data-tab="player">PLAYER</button>
      <button class="tab" data-tab="dsp">DSP</button>
      <button class="tab" data-tab="stream">STREAM</button>
      <button class="tab" data-tab="mta">MTA</button>
      <button class="tab" data-tab="about">INFO</button>
    </nav>
    <main class="content">
      <section id="tab-player" class="tab-panel active">
        <div class="now-playing">
          <div class="cover"><div class="cover-art" id="cover-art"></div><div class="vu-meters"><div class="vu-bar"><div class="vu-fill" id="vu-l"></div></div><div class="vu-bar"><div class="vu-fill" id="vu-r"></div></div></div></div>
          <div class="track-info"><div class="track-title" id="track-title">Nenhuma faixa</div><div class="track-artist" id="track-artist">Cole a URL e CARREGAR</div><div class="progress-wrap"><div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div><div class="time-row"><span id="time-current">0:00</span><span id="time-total">0:00</span></div></div></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="btn-prev">⏮</button>
          <button class="ctrl-btn play-btn" id="btn-play"><span id="icon-play">▶</span><span id="icon-pause" class="hidden">⏸</span></button>
          <button class="ctrl-btn" id="btn-next">⏭</button>
          <div class="volume-wrap"><input type="range" id="volume" min="0" max="100" value="80" /></div>
        </div>
        <div class="panel">
          <div class="panel-header"><span>STREAM</span><button class="btn-sm" id="btn-add-url">+ URL</button></div>
          <div class="stream-url-box"><input type="text" id="stream-url" placeholder="https://servidor:8000/live" /><button class="btn-accent" id="btn-load-stream">CARREGAR</button></div>
          <button class="btn-sm" id="btn-test-stream" style="width:100%;margin-bottom:10px">▶ Testar FIP MP3</button>
          <ul class="playlist" id="playlist"></ul>
        </div>
      </section>
      <section id="tab-dsp" class="tab-panel">
        <div class="panel"><div class="panel-header">PROFILE</div><div class="profile-row"><button class="profile-btn" data-profile="FM">FM</button><button class="profile-btn active" data-profile="MTA">MTA</button><button class="profile-btn" data-profile="WEB">WEB</button></div></div>
        <div class="panel"><div class="panel-header">PLUGINS</div><div id="plugins-root"></div></div>
        <div class="panel"><div class="panel-header"><span>EQ 31</span><div class="toggle" id="tog-geq31"></div></div><div class="eq31-wrap"><div class="eq31" id="eq31"></div></div></div>
        <div class="panel"><div class="panel-header"><span>EQ 10</span><div class="toggle" id="tog-geq10"></div></div><div class="eq31-wrap"><div class="eq31" id="eq10" style="min-width:280px"></div></div></div>
      </section>
      <section id="tab-stream" class="tab-panel"><div class="panel"><pre class="code-block">Android SOURCE → Icecast → Web + DSP</pre></div></section>
      <section id="tab-mta" class="tab-panel"><div class="panel"><label class="full">URL<input type="text" id="mta-url" placeholder="https://seu-servidor:8000/live" /></label><label class="full">Nome<input type="text" id="mta-name" value="RadioMix" /></label><pre class="code-block" id="mta-lua"></pre><button class="btn-accent" id="btn-copy-lua">COPIAR</button></div></section>
      <section id="tab-about" class="tab-panel"><div class="panel"><p class="desc"><strong>RadioMix Web v2.1</strong></p></div></section>
    </main>
    <footer class="footer">RadioMix Web + DSP</footer>
  </div>
  <audio id="audio" preload="none"></audio>
  <script src="https://cdn.jsdelivr.net/gh/ORION292/RadioMixWeb@main/app.js"></script>
</body>
</html>
